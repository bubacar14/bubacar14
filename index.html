<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121733" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Prends ton exercice en photo : Révizo t'explique la méthode, étape par étape. BFEM, BEPC, DEF et BAC, en Afrique de l'Ouest.">
  <title>Révizo</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=Caveat:wght@600&family=JetBrains+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="logo" data-go="home" aria-label="Accueil">
    </button>
    <div class="topbar-droite">
      <span class="pastille pastille-horsligne" id="horsLigne" hidden>Hors ligne</span>
      <span class="pastille pastille-serie" id="serie" aria-label="Série de jours"></span>
      <button class="pastille pastille-credits" id="credits" aria-label="Mes crédits. Recharger"></button>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="onglets" aria-label="Navigation">
    <button data-go="home" class="onglet"></button>
    <button data-go="reviser" class="onglet"></button>
    <button data-go="profil" class="onglet"></button>
  </nav>

  <input type="file" accept="image/*" capture="environment" id="photoInput" hidden>

  <script src="sanko.js"></script>
  <script src="questions.js"></script>
  <script src="essais.js"></script>
  <script src="app.js"></script>
</body>
</html>
